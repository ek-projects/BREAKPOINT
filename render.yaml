services:
  - type: web
    name: breakpoint-nebius
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: python -m compileall .
    startCommand: python demo_server.py
    healthCheckPath: /api/status
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_MODEL
        value: nvidia/Nemotron-3_5-Lightning
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      - key: NEBIUS_MAX_TOKENS
        value: "192"
      - key: NEBIUS_ENABLE_THINKING
        value: "false"
